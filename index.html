<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Barry's Veggie Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%;
    max-width: 820px;
    padding: 0 10px;
  }
  h1 {
    font-size: 16px;
    color: #ffe066;
    text-shadow: 3px 3px 0 #593d29;
    margin: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .title-icon {
    image-rendering: pixelated;
    width: 28px;
    height: 28px;
    background: transparent;
  }
  #frame {
    padding: 10px;
    background: #593d29;
    border: 6px solid #2b1d13;
    border-radius: 4px;
    box-shadow: 0 0 0 4px #8a5a3b;
    max-width: 100%;
  }
  canvas {
    display: block;
    background: #4caf50;
    image-rendering: pixelated;
    width: 100%;
    max-width: 800px;
    height: auto;
    touch-action: none;
  }
  #hint {
    font-size: 9px;
    color: #cfcfcf;
    text-align: center;
    line-height: 1.8;
  }
  @media (max-width: 480px) {
    h1 { font-size: 12px; }
    #hint { font-size: 7px; }
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: #593d29;
    border: 6px solid #2b1d13;
    box-shadow: 0 0 0 4px #8a5a3b;
    border-radius: 4px;
    padding: 26px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .modal-box .title {
    color: #ffe066;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
  }
  .modal-box input {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 10px;
    border: 3px solid #2b1d13;
    border-radius: 2px;
    text-align: center;
    width: 220px;
    background: #fff8ec;
    color: #2b1d13;
  }
  .modal-box input:focus { outline: 3px solid #ffe066; }
  .modal-box button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 12px 18px;
    background: #ff9838;
    border: 3px solid #2b1d13;
    border-radius: 2px;
    color: #2b1d13;
    cursor: pointer;
  }
  .modal-box button:hover { background: #ffb35c; }
</style>
</head>
<body>
<div id="wrap">
  <h1><canvas id="titleIconLeft" class="title-icon" width="28" height="28"></canvas> BARRY'S VEGGIE DASH <canvas id="titleIconRight" class="title-icon" width="28" height="28"></canvas></h1>
  <div id="frame">
    <canvas id="game" width="800" height="500"></canvas>
  </div>
  <div id="hint">use WASD or arrow keys to guide barry<br>avoid being picked up by matt and jo<br>watch out for rotten veggies!</div>
</div>

<div id="nameModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="title">WHAT'S YOUR NAME,<br>VEGGIE HUNTER?</div>
    <input id="nameInput" type="text" maxlength="14" placeholder="Bunny Fan" autocomplete="off">
    <button id="nameSubmit">Press ENTER to start</button>
  </div>
</div>

<script type="module">
  // ============================================================
  // SHARED LEADERBOARD SETUP (Firebase Firestore)
  //
  // Replace the placeholder values below with your own Firebase
  // project's config (Firebase Console → Project Settings → your
  // web app → SDK setup and configuration). These values are safe
  // to be public in client-side code — they identify the project,
  // they are not secret keys. Access is controlled by the Firestore
  // security rules you set in the Firebase Console instead.
  //
  // Until you fill these in, the game still fully works — only the
  // leaderboard screen will show "couldn't load leaderboard".
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyCEChU6HvbqMyhqipX52-U5toeM5ra0ncc",
    authDomain: "barry-s-veggie-dash.firebaseapp.com",
    projectId: "barry-s-veggie-dash",
    storageBucket: "barry-s-veggie-dash.firebasestorage.app",
    messagingSenderId: "375511733302",
    appId: "1:375511733302:web:3d6784350c4aa9c78d7497",
  };
  const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "YOUR_API_KEY";

  let db = null;
  if (FIREBASE_CONFIGURED) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { initializeFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    // auto-detect long-polling: Firestore's default streaming transport
    // (WebChannel) can silently hang behind some proxies/sandboxes; this
    // falls back to long-polling automatically when that happens.
    db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  }

  window.fetchLeaderboard = async function () {
    if (!db) throw new Error('Firebase not configured');
    const { collection, query, orderBy, limit, getDocs } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const q = query(collection(db, 'scores'), orderBy('score', 'desc'), limit(10));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  };

  window.submitScoreToLeaderboard = async function (name, score) {
    if (!db) throw new Error('Firebase not configured');
    const { collection, addDoc } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    await addDoc(collection(db, 'scores'), { name, score, ts: Date.now() });
  };
</script>

    leaderboard = await window.fetchLeaderboard();
    leaderboardStatus = 'idle';
  } catch (e) {
    leaderboardStatus = 'error';
  }
}
async function submitScore(name, points) {
  leaderboardStatus = 'loading';
  try {
    await window.submitScoreToLeaderboard(name, points);
    leaderboard = await window.fetchLeaderboard();
    leaderboardStatus = 'idle';
  } catch (e) {
    leaderboardStatus = 'error';
  }
}

// ---------- Veggie definitions ----------
// Open-ended random spawning: no fixed set, no score cap — veggies spawn
// continuously for the full round and score is just whatever's collected.
// Weights favor the higher-value veggies over carrot (previously 30/20/8,
// which let low-value carrots crowd out the spawn budget and capped realistic
// scores well below the old fixed-budget high score of 4740).
const VEG_TYPES = [
  { id: 'carrot',  points: 20,  weight: 18, name: 'Carrot' },
  { id: 'lettuce', points: 50,  weight: 24, name: 'Lettuce' },
  { id: 'dill',    points: 100, weight: 14, name: 'Dill' },
  { id: 'banana',  points: 200, weight: 3,  name: 'Banana' },
];
const VEG_BY_ID = Object.fromEntries(VEG_TYPES.map(v => [v.id, v]));
// Rotten veggies aren't part of the normal weighted pool — they're gated
// behind their own cooldown (like bananas) so they stay rare and dangerous
// instead of showing up at ordinary veggie frequency.
const ROTTEN_TYPE = { id: 'rotten', points: 0, weight: 4, name: 'Rotten Veggie' };

function pickVeggieType() {
  const pool = [];
  for (const v of VEG_TYPES) {
    if (v.id === 'banana' && bananaCooldown > 0) continue;
    pool.push(v);
  }
  if (rottenCooldown <= 0) pool.push(ROTTEN_TYPE);
  const totalWeight = pool.reduce((s, v) => s + v.weight, 0);
  let r = Math.random() * totalWeight;
  for (const v of pool) {
    if (r < v.weight) return v;
    r -= v.weight;
  }
  return pool[0];
}

// ---------- Generic pixel-block helper (used for field, banana) ----------
function block(cx, cy, u, gx, gy, gw, gh, color, outline = true) {
  const x = cx + gx * u, y = cy + gy * u, w = gw * u, h = gh * u;
  if (outline) {
    ctx.fillStyle = '#1a1208';
    ctx.fillRect(x - u * 0.5, y - u * 0.5, w + u, h + u);
  }
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

// ---------- Asset preprocessing: turn real images into chunky pixel-art sprites ----------

// Finds the bounding box of "not background" pixels in an already-drawn canvas.
function findContentBounds(imgData, w, h, bg) {
  let minX = w, minY = h, maxX = 0, maxY = 0;
  const d = imgData.data;
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const i = (y * w + x) * 4;
      const dr = d[i] - bg.r, dg = d[i + 1] - bg.g, db = d[i + 2] - bg.b;
      if (Math.sqrt(dr * dr + dg * dg + db * db) > 28) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX) return { x: 0, y: 0, w, h };
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// Downscales a source canvas region into a small pixel-art canvas. When `bg`
// is given, near-background pixels are cut to transparent with a crisp
// (non-fuzzy) edge; when `bg` is null the crop is kept as an opaque rectangle
// (used for photo crops where there's no clean background to key out).
function pixelate(sourceCanvas, sx, sy, sw, sh, outW, outH, bg) {
  const cropped = document.createElement('canvas');
  cropped.width = sw; cropped.height = sh;
  const cctx = cropped.getContext('2d');
  cctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
  if (bg) {
    const id = cctx.getImageData(0, 0, sw, sh);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const dr = d[i] - bg.r, dg = d[i + 1] - bg.g, db = d[i + 2] - bg.b;
      if (Math.sqrt(dr * dr + dg * dg + db * db) < 34) d[i + 3] = 0;
    }
    cctx.putImageData(id, 0, 0);
  }

  const small = document.createElement('canvas');
  small.width = outW; small.height = outH;
  const sctx = small.getContext('2d');
  sctx.imageSmoothingEnabled = true;
  sctx.drawImage(cropped, 0, 0, sw, sh, 0, 0, outW, outH);

  if (bg) {
    // hard-clip semi-transparent fringe pixels so edges read as crisp 8-bit blocks
    const sid = sctx.getImageData(0, 0, outW, outH);
    const sd = sid.data;
    for (let i = 3; i < sd.length; i += 4) sd[i] = sd[i] > 110 ? 255 : 0;
    sctx.putImageData(sid, 0, 0);
  }
  return small;
}

function buildBarrySprite(img) {
  const full = document.createElement('canvas');
  full.width = img.naturalWidth; full.height = img.naturalHeight;
  const fctx = full.getContext('2d');
  fctx.drawImage(img, 0, 0);
  const bg = { r: 250, g: 250, b: 250 };
  const bounds = findContentBounds(fctx.getImageData(0, 0, full.width, full.height), full.width, full.height, bg);
  const pad = Math.round(bounds.w * 0.05);
  const sx = Math.max(0, bounds.x - pad), sy = Math.max(0, bounds.y - pad);
  const sw = Math.min(full.width - sx, bounds.w + pad * 2);
  const sh = Math.min(full.height - sy, bounds.h + pad * 2);
  const outW = 26;
  const outH = Math.round(outW * (sh / sw));
  barrySprite = pixelate(full, sx, sy, sw, sh, outW, outH, bg);
  barryAspect = sh / sw;
  barrySpriteRedTint = buildTintedVariant(barrySprite, '#ff4d4d');
  barrySpriteRedTintCB = buildTintedVariant(barrySprite, '#4d94ff');
  barrySpriteGoldTint = buildTintedVariant(barrySprite, '#ffe066');
  barrySpriteReverseTint = buildTintedVariant(barrySprite, '#a86bff');
}

// A recolored copy of a sprite, masked to its own silhouette (via
// source-atop on an isolated canvas) so the tint never bleeds onto
// whatever happens to be drawn behind it on the main canvas.
function buildTintedVariant(sprite, color) {
  const t = document.createElement('canvas');
  t.width = sprite.width; t.height = sprite.height;
  const tctx = t.getContext('2d');
  tctx.drawImage(sprite, 0, 0);
  tctx.globalCompositeOperation = 'source-atop';
  tctx.fillStyle = color;
  tctx.fillRect(0, 0, t.width, t.height);
  return t;
}

function buildVeggieSprites(img) {
  const full = document.createElement('canvas');
  full.width = img.naturalWidth; full.height = img.naturalHeight;
  const fctx = full.getContext('2d');
  fctx.drawImage(img, 0, 0);
  const bgPixel = fctx.getImageData(1, 1, 1, 1).data;
  const bg = { r: bgPixel[0], g: bgPixel[1], b: bgPixel[2] };

  // Exact icon bounding boxes measured from the sheet (icons aren't evenly
  // spaced, so a uniform grid divide landed on the wrong art — these were
  // found by scanning for ink vs. background pixels).
  const rectFor = {
    carrot:  { x0: 210, x1: 270, y0: 170, y1: 235 }, // carrot, row3
    lettuce: { x0: 20,  x1: 79,  y0: 19,  y1: 86 },  // cauliflower/lettuce head, row1
    dill:    { x0: 475, x1: 527, y0: 93,  y1: 166 }, // fennel with wispy top, row2
  };
  for (const id in rectFor) {
    const r = rectFor[id];
    const pad = 4;
    veggieSprites[id] = pixelate(
      full,
      r.x0 + pad, r.y0 + pad, (r.x1 - r.x0) - pad * 2, (r.y1 - r.y0) - pad * 2,
      16, 16, bg
    );
  }
  veggieSprites.banana = buildBananaSprite();
  veggieSprites.rotten = buildRottenVeggieSprite('#a83030');
  // colorblind-mode alt: rot spots shifted from red toward near-black/brown
  // so the warning relies on darkness/contrast instead of a red-vs-green hue.
  veggieSprites.rottenCB = buildRottenVeggieSprite('#3a1410');
}

// A properly curved pixel banana (rare speed-boost power-up): a tapered
// stroke stamped along a quadratic-bezier "C" arc — tip at bottom-left,
// bulging out to the belly at bottom-right, curling up to the stem — with
// a dark maroon outline, gold shadow on the outer edge, and a cream
// highlight on the inner edge, matching a reference curved-banana sprite.
function buildBananaSprite() {
  const W_ = 34, H_ = 30;
  const c = document.createElement('canvas');
  c.width = W_; c.height = H_;
  const octx = c.getContext('2d');
  octx.imageSmoothingEnabled = false;

  const P0 = { x: 5, y: 24 };  // tip (bottom-left)
  const P1 = { x: 29, y: 27 }; // belly control point — pulls the curve outward
  const P2 = { x: 24, y: 3 };  // stem end (top-right)

  const steps = 26;
  const strokes = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    const x = mt * mt * P0.x + 2 * mt * t * P1.x + t * t * P2.x;
    const y = mt * mt * P0.y + 2 * mt * t * P1.y + t * t * P2.y;
    const thick = 2 + Math.sin(Math.PI * Math.pow(t, 0.8)) * 5.5;
    strokes.push({ x, y, r: thick / 2 });
  }
  const stamp = (color, dx, dy, rMul) => {
    octx.fillStyle = color;
    for (const s of strokes) {
      octx.beginPath();
      octx.arc(s.x + (dx || 0) * s.r, s.y + (dy || 0) * s.r, s.r * (rMul || 1), 0, Math.PI * 2);
      octx.fill();
    }
  };

  stamp('#3a1410', 0, 0, 1.22);              // outline pass, drawn once behind everything
  stamp('#ffd93b');                           // main fill
  stamp('rgba(230,150,20,0.55)', 0.35, 0.35, 0.55);  // shadow, outer/convex edge
  stamp('rgba(255,255,225,0.85)', -0.35, -0.35, 0.4); // highlight, inner/concave edge

  // stem cap
  octx.fillStyle = '#3a1410';
  octx.fillRect(P2.x - 2.6, P2.y - 3.6, 5.2, 4.2);
  octx.fillStyle = '#4a8c3a';
  octx.fillRect(P2.x - 1.6, P2.y - 2.6, 3.2, 3);
  // small green blossom fleck at the tip
  octx.fillStyle = '#4a8c3a';
  octx.fillRect(P0.x - 1.4, P0.y + strokes[0].r * 0.5, 2, 1.6);

  return c;
}

// Rotten vegetable power-down: a lumpy sickly-yellow-green blob with red rot
// spots and a few decaying green fragments flaking off the top. Worth 0
// points and reverses Barry's controls for a few seconds on touch.
function buildRottenVeggieSprite(spotColor) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const octx = c.getContext('2d');
  octx.imageSmoothingEnabled = false;

  const blobStamps = [
    { x: 9, y: 20, r: 6.5 },
    { x: 16, y: 17, r: 7.5 },
    { x: 23, y: 21, r: 6.5 },
    { x: 12, y: 25, r: 6 },
    { x: 20, y: 25, r: 6 },
  ];
  octx.fillStyle = '#4a3210';
  for (const s of blobStamps) {
    octx.beginPath(); octx.arc(s.x, s.y, s.r + 1.2, 0, Math.PI * 2); octx.fill();
  }
  octx.fillStyle = '#c7cf4a';
  for (const s of blobStamps) {
    octx.beginPath(); octx.arc(s.x, s.y, s.r, 0, Math.PI * 2); octx.fill();
  }
  octx.fillStyle = 'rgba(140,140,30,0.5)';
  for (const s of blobStamps) {
    octx.beginPath(); octx.arc(s.x, s.y + s.r * 0.35, s.r * 0.8, 0, Math.PI * 2); octx.fill();
  }
  octx.fillStyle = spotColor;
  const spots = [{ x: 11, y: 18, r: 1.8 }, { x: 19, y: 15, r: 1.6 }, { x: 24, y: 22, r: 1.7 }, { x: 14, y: 26, r: 1.5 }, { x: 21, y: 27, r: 1.4 }];
  for (const s of spots) {
    octx.beginPath(); octx.arc(s.x, s.y, s.r, 0, Math.PI * 2); octx.fill();
  }
  const flecks = [{ x: 6, y: 6, w: 3, h: 3 }, { x: 13, y: 2, w: 3, h: 3 }, { x: 20, y: 5, w: 3, h: 3 }, { x: 9, y: 10, w: 2.5, h: 2.5 }];
  octx.fillStyle = '#4a3210';
  for (const f of flecks) octx.fillRect(f.x - 0.7, f.y - 0.7, f.w + 1.4, f.h + 1.4);
  octx.fillStyle = '#7fbf4a';
  for (const f of flecks) octx.fillRect(f.x, f.y, f.w, f.h);

  return c;
}

// Soft pulsing glow drawn behind the banana so it reads as a special item.
function drawBananaGlow(cx, cy) {
  const t = performance.now();
  const pulse = 0.45 + Math.sin(t / 260) * 0.18;
  const r = 24;
  const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
  grad.addColorStop(0, `rgba(255,240,150,${pulse})`);
  grad.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

// A few twinkling sparkles orbiting near the banana.
function drawSparkles(cx, cy, w, h) {
  const t = performance.now();
  const pts = [
    { dx: -w * 0.5, dy: -h * 0.3, phase: 0 },
    { dx: w * 0.45, dy: -h * 0.05, phase: 2.1 },
    { dx: w * 0.1, dy: h * 0.42, phase: 4.2 },
  ];
  for (const p of pts) {
    const a = (Math.sin(t / 240 + p.phase) + 1) / 2;
    if (a < 0.45) continue;
    const s = 2.5 + a * 2.5;
    const x = cx + p.dx, y = cy + p.dy;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff8d0';
    ctx.fillRect(x - 0.6, y - s, 1.2, s * 2);
    ctx.fillRect(x - s, y - 0.6, s * 2, 1.2);
    ctx.globalAlpha = 1;
  }
}

// Builds a small hand-pixelled chibi sprite (big rounded head, simple blocky
// body, thick black outline) in the style of classic RPG overworld sprites —
// styled after a reference image, not cropped from a photo.
function buildChibiSprite(opts) {
  const u = 4;
  const canvasW = 15 * u, canvasH = 20 * u;
  const c = document.createElement('canvas');
  c.width = canvasW; c.height = canvasH;
  const octx = c.getContext('2d');
  octx.imageSmoothingEnabled = false;

  const parts = [];
  const add = (gx, gy, gw, gh, color) => parts.push({ gx, gy, gw, gh, color });

  // legs + shoes
  add(5, 15, 2, 4, opts.pants);
  add(8, 15, 2, 4, opts.pants);
  add(4.5, 18.4, 3, 1.3, '#3a2a1e');
  add(7.5, 18.4, 3, 1.3, '#3a2a1e');
  // arms, reaching slightly forward as if mid-chase
  add(1, 10, 2.5, 5, opts.shirt);
  add(11.5, 10, 2.5, 5, opts.shirt);
  // torso
  add(4, 9, 7, 7, opts.shirt);
  // neck + head
  add(6, 7.5, 3, 2, opts.skin);
  add(3, 1, 9, 7, opts.skin);
  add(3.5, 0, 8, 1, opts.skin);
  // hair
  if (opts.hairStyle === 'short') {
    add(2.3, -0.5, 10.4, 2.6, opts.hair);
    add(2.3, 1, 1.6, 3.2, opts.hair);
    add(11.1, 1, 1.6, 3.2, opts.hair);
  } else {
    add(2, -0.5, 11, 3, opts.hair);
    add(1.7, 1.5, 2.1, 7.5, opts.hair);
    add(11.2, 1.5, 2.1, 7.5, opts.hair);
  }

  // one solid black outline pass behind everything (avoids seams between
  // adjacent same-color pieces), then the actual colors on top
  octx.fillStyle = '#1a1208';
  for (const p of parts) {
    octx.fillRect(p.gx * u - u * 0.6, p.gy * u - u * 0.6, p.gw * u + u * 1.2, p.gh * u + u * 1.2);
  }
  for (const p of parts) {
    octx.fillStyle = p.color;
    octx.fillRect(p.gx * u, p.gy * u, p.gw * u, p.gh * u);
  }

  // simple one-sided shading for depth
  octx.fillStyle = 'rgba(0,0,0,0.16)';
  octx.fillRect((4 + 7 - 1.6) * u, 9 * u, 1.6 * u, 7 * u);
  octx.fillRect((3 + 9 - 2) * u, 1 * u, 2 * u, 7 * u);

  // face
  octx.fillStyle = '#1a1208';
  octx.fillRect((3 + 2.2) * u, (1 + 2.6) * u, 1 * u, 1.3 * u);
  octx.fillRect((3 + 5.8) * u, (1 + 2.6) * u, 1 * u, 1.3 * u);
  octx.fillStyle = '#a85a3a';
  octx.fillRect((3 + 3) * u, (1 + 4.7) * u, 3 * u, 0.6 * u);

  if (opts.accessory === 'necklace') {
    octx.fillStyle = '#e8c14a';
    octx.fillRect((6 + 1) * u, (7.5 + 1.6) * u, 1 * u, 0.6 * u);
  }
  if (opts.accessory === 'earring') {
    octx.fillStyle = '#4caf50';
    octx.fillRect((3 + 9 - 0.9) * u, (1 + 3) * u, 0.7 * u, 0.7 * u);
  }
  if (opts.tattoo) {
    octx.fillStyle = '#2f4f5f';
    octx.fillRect((1 + 0.6) * u, (10 + 1.5) * u, 0.8 * u, 0.8 * u);
    octx.fillRect((11.5 + 1.1) * u, (10 + 2.3) * u, 0.8 * u, 0.8 * u);
  }

  return c;
}

function buildChaserSprites() {
  // Matt: short dark wavy hair, light shirt, small green earring stud.
  mattSprite = buildChibiSprite({
    skin: '#e3b58c', hair: '#1e1712', hairStyle: 'short',
    shirt: '#f2f2ee', pants: '#33415c', accessory: 'earring',
  });
  // Jo: long dark hair, dark top, gold necklace, floral tattoos on both arms.
  joSprite = buildChibiSprite({
    skin: '#d99b73', hair: '#17110d', hairStyle: 'long',
    shirt: '#262019', pants: '#33415c', accessory: 'necklace', tattoo: true,
  });
}

function buildFieldTexture() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const fctx = c.getContext('2d');
  const tile = 25;
  for (let y = 0; y < H; y += tile) {
    for (let x = 0; x < W; x += tile) {
      const even = ((x / tile) + (y / tile)) % 2 === 0;
      fctx.fillStyle = even ? '#4caf50' : '#57bb57';
      fctx.fillRect(x, y, tile, tile);
    }
  }
  // scatter hand-pixelled grass blade tufts across the field
  let seed = 1337;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < 170; i++) {
    const x = Math.round(rand() * W), y = Math.round(rand() * H);
    const u = 3 + Math.round(rand() * 2);
    const dark = '#2e7d32', mid = '#4caf50', light = '#8de08f';
    const blades = [
      { dx: -u, h: 2 },
      { dx: 0, h: 3 },
      { dx: u, h: 2 },
    ];
    for (const b of blades) {
      fctx.fillStyle = dark;
      fctx.fillRect(x + b.dx, y, u, u * b.h);
      fctx.fillStyle = b.h === 3 ? light : mid;
      fctx.fillRect(x + b.dx, y, u, u);
    }
  }
  fieldTexture = c;
}

// Renders Barry's real (brown) pixel-art sprite into the two title-bar icon
// canvases, replacing the generic white rabbit emoji — same art as in-game,
// just scaled down, so the title truly shows Barry's own coloring.
function drawTitleIcons() {
  for (const id of ['titleIconLeft', 'titleIconRight']) {
    const c = document.getElementById(id);
    if (!c) continue;
    const ictx = c.getContext('2d');
    ictx.imageSmoothingEnabled = false;
    ictx.clearRect(0, 0, c.width, c.height);
    const scale = Math.min(c.width / barrySprite.width, c.height / barrySprite.height);
    const w = barrySprite.width * scale, h = barrySprite.height * scale;
    ictx.drawImage(barrySprite, (c.width - w) / 2, (c.height - h) / 2, w, h);
  }
}

function loadAssets() {
  let loaded = 0;
  const need = 2;
  const done = () => { loaded++; if (loaded === need) {
    buildBarrySprite(barryImg);
    drawTitleIcons();
    buildVeggieSprites(veggieImg);
    buildChaserSprites();
    buildFieldTexture();
    assetsReady = true;
    refreshLeaderboard();
    state = 'home';
  }};
  const barryImg = new Image();
  barryImg.onload = done;
  barryImg.src = BARRY_PHOTO_SRC;
  const veggieImg = new Image();
  veggieImg.onload = done;
  veggieImg.src = VEGGIES_SHEET_SRC;
}
loadAssets();

// ---------- Barry drawing ----------
function drawBarry() {
  const bob = barry.moving ? Math.sin(barry.hopPhase) * 4 : Math.sin(barry.hopPhase * 0.3) * 1;
  const scale = 3.6;
  const w = barrySprite.width * scale;
  const h = barrySprite.height * scale;
  const dx = barry.x - w / 2;
  const dy = barry.y - h / 2 + bob - h * 0.15;

  if (barry.boostTimer > 0 && barry.slowTimer <= 0) {
    const t = performance.now();
    const pulse = 0.4 + Math.sin(t / 130) * 0.2;
    const r = Math.max(w, h) * 0.6;
    const grad = ctx.createRadialGradient(barry.x, barry.y, 4, barry.x, barry.y, r);
    grad.addColorStop(0, `rgba(255,225,110,${pulse})`);
    grad.addColorStop(1, 'rgba(255,225,110,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(barry.x, barry.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.drawImage(barrySprite, dx, dy, w, h);

  if (barry.slowTimer > 0) {
    ctx.globalAlpha = 0.4;
    ctx.drawImage(colorblindMode ? barrySpriteRedTintCB : barrySpriteRedTint, dx, dy, w, h);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#ffe066';
    ctx.font = '14px monospace';
    ctx.fillText('!', barry.x + w * 0.35, dy - 6 + Math.sin(barry.hopPhase * 2) * 4);
  } else if (barry.reverseTimer > 0) {
    ctx.globalAlpha = 0.45;
    ctx.drawImage(barrySpriteReverseTint, dx, dy, w, h);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#d9b6ff';
    ctx.font = '14px monospace';
    ctx.fillText('⇅', barry.x + w * 0.35, dy - 6 + Math.sin(barry.hopPhase * 2) * 4);
  } else if (barry.boostTimer > 0) {
    ctx.globalAlpha = 0.35;
    ctx.drawImage(barrySpriteGoldTint, dx, dy, w, h);
    ctx.globalAlpha = 1;
  }
}

// ---------- Veggie drawing ----------
function drawVeggie(v) {
  const sprite = (v.type.id === 'rotten' && colorblindMode) ? veggieSprites.rottenCB : veggieSprites[v.type.id];
  if (!sprite) return;
  const bob = Math.sin(v.spawnTime + performance.now() / 250) * 2;
  const scale = TARGET_VEGGIE_SIZE / sprite.width;
  const w = sprite.width * scale, h = sprite.height * scale;
  const cx = v.x, cy = v.y + bob;

  if (v.type.id === 'banana') {
    drawBananaGlow(cx, cy);
    ctx.drawImage(sprite, cx - w / 2, cy - h / 2, w, h);
    drawSparkles(cx, cy, w, h);
  } else {
    ctx.drawImage(sprite, cx - w / 2, cy - h / 2, w, h);
  }
}

// ---------- Chaser (Matt / Jo) drawing ----------
// The exact on-screen rectangle a chaser's sprite occupies — used for both
// drawing and hit-testing so the hitbox always matches the visible image.
function chaserBounds(c) {
  const sprite = c.person === 'matt' ? mattSprite : joSprite;
  const scale = c.size / 60;
  const w = sprite.width * scale, h = sprite.height * scale;
  const left = c.x - w / 2, top = c.y - h + 8;
  return { left, top, right: left + w, bottom: top + h, w, h };
}

function drawChaser(c) {
  const sprite = c.person === 'matt' ? mattSprite : joSprite;
  if (!sprite) return;
  const alpha = Math.min(1, c.age / 0.4, (c.maxLife - c.age) / 0.6);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  const b = chaserBounds(c);
  ctx.drawImage(sprite, b.left, b.top, b.w, b.h);
  ctx.restore();
}

// ---------- Audio (synthesized with Web Audio API, no sound files) ----------
let audioCtx = null;
function unlockAudio() {
  // Must be called from a real user gesture (button click / keydown) — the
  // browser blocks audio otherwise. startGame() is always reached that way.
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type, startDelay, peakGain) {
  if (!audioCtx || soundMuted) return;
  const t0 = audioCtx.currentTime + (startDelay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.15, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
// short upward "get" blip for a normal veggie
function playCollectSound() {
  playTone(660, 0.08, 'square', 0, 0.12);
  playTone(880, 0.09, 'square', 0.05, 0.12);
}
// low "uh oh" for a rotten veggie
function playRottenSound() {
  playTone(220, 0.15, 'sawtooth', 0, 0.14);
  playTone(160, 0.22, 'sawtooth', 0.12, 0.14);
}
// short celebratory arpeggio for a banana
function playBananaSound() {
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, i) => playTone(freq, 0.12, 'square', i * 0.07, 0.13));
}
// dull low "thud" for getting caught by Matt or Jo
function playCaughtSound() {
  playTone(180, 0.1, 'triangle', 0, 0.16);
  playTone(110, 0.16, 'triangle', 0.06, 0.16);
}

// ---------- Setup / reset ----------
function trySpawnChaser() {
  if (chasers.length >= MAX_CHASERS) return;
  let attempts = 0;
  while (attempts < 30) {
    attempts++;
    const size = 62 + Math.random() * 20;
    const x = 80 + Math.random() * (W - 160);
    const y = 100 + Math.random() * (H - 170);
    if (Math.hypot(x - barry.x, y - barry.y) < 140) continue;
    let overlaps = false;
    for (const c of chasers) {
      if (Math.hypot(x - c.x, y - c.y) < 160) { overlaps = true; break; }
    }
    if (overlaps) continue;
    chasers.push({
      x, y, size, radius: size * 0.4,
      person: Math.random() < 0.5 ? 'matt' : 'jo',
      age: 0, maxLife: 6 + Math.random() * 6,
    });
    return;
  }
}

function startGame() {
  unlockAudio();
  score = 0;
  timeLeft = 60;
  barry.x = W / 2;
  barry.y = H / 2;
  barry.slowTimer = 0;
  barry.boostTimer = 0;
  barry.reverseTimer = 0;
  barry.hitCooldown = 0;
  veggies = [];
  popups = [];
  chasers = [];
  spawnTimer = 0;
  chaserSpawnTimer = 0.3;
  bananaCooldown = 6;
  rottenCooldown = 10;
  menuOpen = false;
  state = 'playing';
}

function endGame() {
  state = 'gameover';
  submitScore(playerName || 'Bunny Fan', score);
}

// ---------- Spawning ----------
function trySpawnVeggie() {
  if (veggies.length >= 6) return;
  let attempts = 0;
  while (attempts < 20) {
    attempts++;
    const x = 40 + Math.random() * (W - 80);
    const y = 50 + Math.random() * (H - 90);
    let ok = true;
    for (const c of chasers) {
      if (Math.hypot(x - c.x, y - c.y) < c.radius + 30) { ok = false; break; }
    }
    if (!ok) continue;
    for (const v of veggies) {
      if (Math.hypot(x - v.x, y - v.y) < 40) { ok = false; break; }
    }
    if (!ok) continue;
    const type = pickVeggieType();
    veggies.push({ x, y, type, life: 4.5, spawnTime: Math.random() * 10 });
    if (type.id === 'banana') bananaCooldown = 15 + Math.random() * 10;
    if (type.id === 'rotten') rottenCooldown = 25 + Math.random() * 15;
    return;
  }
}

// ---------- Update ----------
function update(dt) {
  if (state !== 'playing') return;

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }

  const speed = barry.slowTimer > 0 ? barry.slowSpeed : (barry.boostTimer > 0 ? barry.boostSpeed : barry.baseSpeed);
  let dx = 0, dy = 0;
  let snapToTarget = false;
  let hasInput = false;
  // The menu overlay only blocks Barry's own movement input — the timer,
  // veggie spawns/expiry, and chasers all keep running underneath so the
  // menu can't be used to "pause" and plan an optimal route.
  if (menuOpen) {
    // no input while the menu has focus
  } else if (touchActive) {
    // dragging a finger: head toward the touch point, snapping on arrival
    // so Barry doesn't jitter around it once close.
    dx = touchTargetX - barry.x;
    dy = touchTargetY - barry.y;
    snapToTarget = true;
    hasInput = Math.hypot(dx, dy) > 2; // small deadzone right at the touch point
  } else {
    if (keysDown.has('ArrowLeft') || keysDown.has('a')) dx -= 1;
    if (keysDown.has('ArrowRight') || keysDown.has('d')) dx += 1;
    if (keysDown.has('ArrowUp') || keysDown.has('w')) dy -= 1;
    if (keysDown.has('ArrowDown') || keysDown.has('s')) dy += 1;
    hasInput = dx !== 0 || dy !== 0;
  }
  if (barry.reverseTimer > 0) { dx = -dx; dy = -dy; snapToTarget = false; }
  barry.moving = hasInput;
  if (barry.moving) {
    const dist = Math.hypot(dx, dy);
    const maxMove = speed * dt;
    if (snapToTarget && dist <= maxMove) {
      barry.x += dx;
      barry.y += dy;
    } else {
      barry.x += (dx / dist) * maxMove;
      barry.y += (dy / dist) * maxMove;
    }
  }
  barry.x = Math.max(30, Math.min(W - 30, barry.x));
  barry.y = Math.max(35, Math.min(H - 20, barry.y));

  barry.hopPhase += barry.moving ? dt * (barry.boostTimer > 0 ? 15 : 10) : dt * 2;
  if (barry.slowTimer > 0) barry.slowTimer -= dt;
  if (barry.boostTimer > 0) barry.boostTimer -= dt;
  if (barry.reverseTimer > 0) barry.reverseTimer -= dt;
  if (barry.hitCooldown > 0) barry.hitCooldown -= dt;
  if (bananaCooldown > 0) bananaCooldown -= dt;
  if (rottenCooldown > 0) rottenCooldown -= dt;

  // chasers: random appearance + lifespan + collision (vanish on hit)
  chaserSpawnTimer -= dt;
  if (chaserSpawnTimer <= 0) {
    trySpawnChaser();
    chaserSpawnTimer = 2 + Math.random() * 2.5;
  }
  for (let i = chasers.length - 1; i >= 0; i--) {
    const c = chasers[i];
    c.age += dt;
    if (c.age >= c.maxLife) { chasers.splice(i, 1); continue; }
    if (c.age < 0.4) continue;
    const cb = chaserBounds(c);
    const closestX = Math.max(cb.left, Math.min(barry.x, cb.right));
    const closestY = Math.max(cb.top, Math.min(barry.y, cb.bottom));
    const d = Math.hypot(barry.x - closestX, barry.y - closestY);
    if (d < barry.radius && barry.hitCooldown <= 0) {
      barry.slowTimer = 1;
      barry.hitCooldown = 1.5;
      playCaughtSound();
      const name = c.person === 'matt' ? 'MATT' : 'JO';
      popups.push({ x: barry.x, y: barry.y - 50, text: 'CAUGHT BY ' + name + '!', life: 0.9, vy: -30, color: '#ff6b6b' });
      chasers.splice(i, 1);
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) { trySpawnVeggie(); spawnTimer = 0.55 + Math.random() * 0.5; }

  for (let i = veggies.length - 1; i >= 0; i--) {
    const v = veggies[i];
    v.life -= dt;
    if (v.life <= 0) { veggies.splice(i, 1); continue; }
    const d = Math.hypot(barry.x - v.x, barry.y - v.y);
    if (d < barry.radius + 14) {
      score += v.type.points;
      if (v.type.id === 'banana') {
        barry.boostTimer = 5;
        playBananaSound();
        popups.push({ x: v.x, y: v.y, text: '+' + v.type.points + ' SPEED BOOST!', life: 1.1, vy: -45, color: '#fff2a8' });
      } else if (v.type.id === 'rotten') {
        barry.reverseTimer = 3;
        playRottenSound();
        popups.push({ x: v.x, y: v.y, text: 'ROTTEN! CONTROLS REVERSED!', life: 1.1, vy: -45, color: colorblindMode ? '#f2f2f2' : '#b6ff4d' });
      } else {
        playCollectSound();
        popups.push({ x: v.x, y: v.y, text: '+' + v.type.points, life: 0.9, vy: -45, color: '#ffe066' });
      }
      veggies.splice(i, 1);
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt; p.y += p.vy * dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

// ---------- Buttons ----------
// hotkeyChar: true underlines the label's first character (the common case,
// where the hotkey is that letter); a number instead underlines the
// character at that index, for buttons whose hotkey isn't the first letter.
function addButton(x, y, w, h, label, action, hotkeyChar) {
  let underlineIndex = null;
  if (hotkeyChar === true) underlineIndex = 0;
  else if (typeof hotkeyChar === 'number') underlineIndex = hotkeyChar;
  buttons.push({ x, y, w, h, label, action, underlineIndex });
}
function isHovered(b) {
  return mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h;
}
function drawButtons() {
  for (const b of buttons) {
    const hovered = isHovered(b);
    ctx.fillStyle = hovered ? '#ffb35c' : '#ff9838';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#2b1d13';
    ctx.lineWidth = 3;
    ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
    ctx.fillStyle = '#2b1d13';
    ctx.font = '11px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2 + 1;
    ctx.fillText(b.label, cx, cy);
    if (b.underlineIndex !== null) {
      // underline just the hotkey letter, wherever it falls in the label
      const totalW = ctx.measureText(b.label).width;
      const beforeW = ctx.measureText(b.label.slice(0, b.underlineIndex)).width;
      const charW = ctx.measureText(b.label[b.underlineIndex]).width;
      const textLeft = cx - totalW / 2;
      ctx.fillRect(textLeft + beforeW, cy + 7, charW, 2);
    }
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }
}

// Greedy word wrap using actual glyph widths (ctx.font must already be set).
function wrapText(text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

const PATCH_NOTES_STYLE = {
  version: { font: '11px "Press Start 2P", monospace', lineHeight: 20, gapBefore: 16 },
  section: { font: '10px "Press Start 2P", monospace', lineHeight: 16, gapBefore: 10 },
  bullet: { font: '8px "Press Start 2P", monospace', lineHeight: 13, gapBefore: 2 },
  gap: { lineHeight: 10, gapBefore: 0 },
};

// Wraps PATCH_NOTES into concrete draw lines with y-offsets (relative to the
// top of the scrollable area). Rebuilt each call since it's cheap and the
// viewport width never changes at runtime.
function layoutPatchNotes(contentWidth) {
  const lines = [];
  let y = 0;
  for (const entry of PATCH_NOTES) {
    const style = PATCH_NOTES_STYLE[entry.type];
    y += style.gapBefore;
    if (entry.type === 'gap') { y += style.lineHeight; continue; }
    ctx.font = style.font;
    const indent = entry.type === 'bullet' ? 16 : 0;
    const prefix = entry.type === 'bullet' ? '- ' : '';
    const wrapped = wrapText(prefix + entry.text, contentWidth - indent);
    for (const wline of wrapped) {
      lines.push({ text: wline, y, font: style.font, indent });
      y += style.lineHeight;
    }
  }
  return { lines, totalHeight: y };
}

function drawPatchNotesScreen() {
  ctx.drawImage(fieldTexture, 0, 0);
  ctx.fillStyle = 'rgba(20, 15, 10, 0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '18px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffe066';
  ctx.fillText('PATCH NOTES', W / 2, 50);
  ctx.textAlign = 'left';

  const areaX = 60, areaY = 85, areaW = W - 120, areaH = H - 175;
  const { lines, totalHeight } = layoutPatchNotes(areaW - 4);
  patchNotesMaxScroll = Math.max(0, totalHeight - areaH);
  patchNotesScrollY = Math.max(0, Math.min(patchNotesScrollY, patchNotesMaxScroll));

  ctx.save();
  ctx.beginPath();
  ctx.rect(areaX, areaY, areaW, areaH);
  ctx.clip();
  ctx.fillStyle = '#ffffff';
  for (const line of lines) {
    const ly = areaY + line.y - patchNotesScrollY;
    if (ly < areaY - 20 || ly > areaY + areaH + 20) continue; // skip off-screen lines
    ctx.font = line.font;
    ctx.fillText(line.text, areaX + line.indent, ly + 10);
  }
  ctx.restore();

  // simple scrollbar thumb so it's clear there's more content to scroll to
  if (patchNotesMaxScroll > 0) {
    const trackX = areaX + areaW + 8;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(trackX, areaY, 4, areaH);
    const thumbH = Math.max(24, areaH * (areaH / totalHeight));
    const thumbY = areaY + (patchNotesScrollY / patchNotesMaxScroll) * (areaH - thumbH);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(trackX, thumbY, 4, thumbH);
  }

  addButton(W / 2 - 80, H - 76, 160, 44, 'BACK', patchNotesGoBack, true);
  drawButtons();
}

  } else if (leaderboardStatus === 'error') {
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('couldn\'t load leaderboard', W / 2, 130);
    ctx.font = '9px "Press Start 2P", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('check your connection and try again', W / 2, 155);
    ctx.font = '11px "Press Start 2P", monospace';
  } else if (leaderboard.length === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.fillText('no scores yet — be the first!', W / 2, 140);
  } else {
    const startY = 100;
    leaderboard.slice(0, 10).forEach((entry, i) => {
      const y = startY + i * 30;
      ctx.textAlign = 'left';
      ctx.fillStyle = i === 0 ? '#ffe066' : '#ffffff';
      ctx.fillText((i + 1) + '. ' + entry.name.slice(0, 14), 90, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#a3e35c';
      ctx.fillText(String(entry.score), W - 90, y);
    });
  }
  ctx.textAlign = 'left';

  addButton(W / 2 - 80, H - 76, 160, 44, 'BACK', leaderboardGoBack, true);
  drawButtons();
}

// Shared by the pause menu's buttons and its H/L/R keyboard hotkeys.
function menuGoHome() {
  menuOpen = false;
  state = 'home';
}
function menuGoLeaderboard() {
  leaderboardReturnState = 'playing'; // BACK from here reopens this menu, mid-round
  refreshLeaderboard();
  state = 'leaderboard';
}
function menuRestart() {
  menuOpen = false;
  startGame();
}
function menuGoSettings() {
  settingsReturnState = 'playing'; // BACK from here reopens this menu, mid-round
  state = 'settings';
}

// Shared by the home screen's buttons and its S/L keyboard hotkeys.
function homeGoLeaderboard() {
  leaderboardReturnState = 'home';
  refreshLeaderboard();
  state = 'leaderboard';
}
function homeGoSettings() {
  settingsReturnState = 'home';
  state = 'settings';
}
function homeGoPatchNotes() {
  patchNotesScrollY = 0;
  state = 'patchnotes';
}
function patchNotesGoBack() { state = 'home'; }

// Shared by the game-over screen's buttons and its P/L/H keyboard hotkeys.
function gameoverPlayAgain() { startGame(); }
function gameoverGoLeaderboard() {
  leaderboardReturnState = 'gameover';
  refreshLeaderboard();
  state = 'leaderboard';
}
function gameoverGoHome() { state = 'home'; }

function drawPauseMenu() {
  ctx.fillStyle = 'rgba(20, 15, 10, 0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '20px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffe066';
  ctx.fillText('MENU', W / 2, 120);
  ctx.font = '9px "Press Start 2P", monospace';
  ctx.fillStyle = '#ff9838';
  ctx.fillText('the clock keeps running!', W / 2, 148);
  ctx.textAlign = 'left';

  addButton(W / 2 - 100, 190, 200, 46, 'HOME', menuGoHome, true);
  addButton(W / 2 - 100, 248, 200, 46, 'LEADERBOARD', menuGoLeaderboard, true);
  addButton(W / 2 - 100, 306, 200, 46, 'RESTART', menuRestart, true);
  addButton(W / 2 - 100, 364, 200, 46, 'SETTINGS', menuGoSettings, true);
  drawButtons();
}

function draw() {
  buttons = [];
  canvas.style.cursor = (state === 'playing' && !menuOpen) ? 'default' : 'pointer';

  if (state === 'loading') {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText('loading barry...', W / 2, H / 2);
    ctx.textAlign = 'left';
    return;
  }

  if (state === 'home') { drawHome(); return; }
  if (state === 'leaderboard') { drawLeaderboardScreen(); return; }
  if (state === 'settings') { drawSettingsScreen(); return; }
  if (state === 'patchnotes') { drawPatchNotesScreen(); return; }

  ctx.drawImage(fieldTexture, 0, 0);
  for (const c of chasers) drawChaser(c);
  for (const v of veggies) drawVeggie(v);
  if (state === 'playing') drawBarry();

  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life / 0.9);
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillStyle = p.color;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';

  if (state === 'playing') drawHUD();
  if (state === 'playing' && menuOpen) drawPauseMenu();

  if (state === 'gameover') {
    drawOverlay([
      { text: 'TIME UP!', size: 22, color: '#ff6b6b' },
      { text: playerName || 'Bunny Fan', size: 12, color: '#ffffff' },
      { text: 'score: ' + score, size: 16, color: '#ffe066' },
      { text: 'best: ' + (leaderboard[0] ? leaderboard[0].name + ' - ' + leaderboard[0].score : '---'), size: 10, color: '#a3e35c' },
    ]);
    addButton(W / 2 - 260, H - 80, 160, 50, 'PLAY AGAIN', gameoverPlayAgain, true);
    addButton(W / 2 - 80, H - 80, 160, 50, 'LEADERBOARD', gameoverGoLeaderboard, true);
    addButton(W / 2 + 100, H - 80, 160, 50, 'HOME', gameoverGoHome, true);
    drawButtons();
  }
}

// ---------- Loop ----------
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Input ----------
function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height),
  };
}
function tryActivateButton() {
  for (const b of buttons) {
    if (isHovered(b)) { b.action(); return true; }
  }
  return false;
}

canvas.addEventListener('mousemove', (e) => {
  const pos = canvasPos(e.clientX, e.clientY);
  mouseX = pos.x; mouseY = pos.y;
});
canvas.addEventListener('click', () => { tryActivateButton(); });
canvas.addEventListener('wheel', (e) => {
  if (state !== 'patchnotes') return;
  e.preventDefault();
  patchNotesScrollY = Math.max(0, Math.min(patchNotesMaxScroll, patchNotesScrollY + e.deltaY));
}, { passive: false });

// Touch support: dragging a finger moves Barry the same way the mouse used
// to; a tap also doubles as a button press on the menu screens. preventDefault
// (with the listeners marked non-passive) stops the page from scrolling or
// pinch-zooming while playing.
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const pos = canvasPos(t.clientX, t.clientY);
  mouseX = pos.x; mouseY = pos.y;
  touchTargetX = pos.x; touchTargetY = pos.y;
  touchActive = true;
  patchNotesTouchLastY = t.clientY;
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const pos = canvasPos(t.clientX, t.clientY);
  mouseX = pos.x; mouseY = pos.y;
  if (state === 'patchnotes') {
    patchNotesScrollY = Math.max(0, Math.min(patchNotesMaxScroll, patchNotesScrollY + (patchNotesTouchLastY - t.clientY)));
    patchNotesTouchLastY = t.clientY;
  } else {
    touchTargetX = pos.x; touchTargetY = pos.y;
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  touchActive = false;
  tryActivateButton();
}, { passive: false });
canvas.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  touchActive = false;
}, { passive: false });

const MOVEMENT_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'w', 'a', 's', 'd']);
const normalizeKey = (key) => (key.length === 1 ? key.toLowerCase() : key);
const isTypingTarget = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
window.addEventListener('keydown', (e) => {
  if (isTypingTarget(document.activeElement)) return; // let the name field receive every key normally
  const key = normalizeKey(e.key);
  // checked ahead of the pause-menu's own "m" binding below, so mute still
  // works here even when Settings was reached via the pause menu (menuOpen
  // stays true underneath it, which would otherwise swallow "m" first).
  if (state === 'settings' && (key === 'm' || key === 'c')) {
    e.preventDefault();
    if (key === 'm') settingsToggleMute();
    else settingsToggleColorblind();
    return;
  }
  if ((key === 'm' || key === 'Escape') && (state === 'playing' || menuOpen)) {
    e.preventDefault();
    if (state === 'playing') menuOpen = !menuOpen; // toggle: opens the pause menu, or closes it to resume
    return;
  }
  if (state === 'leaderboard' && key === 'b') { // works whether reached from home, game over, or the pause menu
    e.preventDefault();
    leaderboardGoBack();
    return;
  }
  if (state === 'settings' && key === 'b') { // works whether reached from home or the pause menu
    e.preventDefault();
    settingsGoBack();
    return;
  }
  if (state === 'patchnotes' && key === 'b') {
    e.preventDefault();
    patchNotesGoBack();
    return;
  }
  if (menuOpen) {
    if (state === 'playing') { // the pause menu itself (not its leaderboard/settings detour) is on screen
      if (key === 'h') { e.preventDefault(); menuGoHome(); return; }
      if (key === 'l') { e.preventDefault(); menuGoLeaderboard(); return; }
      if (key === 'r') { e.preventDefault(); menuRestart(); return; }
      if (key === 's') { e.preventDefault(); menuGoSettings(); return; }
    }
    return; // menu flow is active — ignore restart/movement hotkeys otherwise
  }
  if (state === 'home') {
    if (key === 's') { e.preventDefault(); showNameModal(); return; }
    if (key === 'l') { e.preventDefault(); homeGoLeaderboard(); return; }
    if (key === 't') { e.preventDefault(); homeGoSettings(); return; }
    if (key === 'n') { e.preventDefault(); homeGoPatchNotes(); return; }
  }
  if (state === 'patchnotes') {
    if (key === 'ArrowDown') { e.preventDefault(); patchNotesScrollY = Math.min(patchNotesMaxScroll, patchNotesScrollY + 40); return; }
    if (key === 'ArrowUp') { e.preventDefault(); patchNotesScrollY = Math.max(0, patchNotesScrollY - 40); return; }
  }
  if (state === 'gameover') {
    if (key === 'p') { e.preventDefault(); gameoverPlayAgain(); return; }
    if (key === 'l') { e.preventDefault(); gameoverGoLeaderboard(); return; }
    if (key === 'h') { e.preventDefault(); gameoverGoHome(); return; }
  }
  if (key === 'r' && state === 'playing') {
    e.preventDefault();
    startGame(); // restart hotkey: only active mid-round, resets score/timer/veggies/position
    return;
  }
  if (MOVEMENT_KEYS.has(key)) {
    e.preventDefault();
    keysDown.add(key);
  }
});
window.addEventListener('keyup', (e) => {
  if (isTypingTarget(document.activeElement)) return;
  keysDown.delete(normalizeKey(e.key));
});
window.addEventListener('blur', () => keysDown.clear());

// ---------- Name modal ----------
const nameModal = document.getElementById('nameModal');
const nameInput = document.getElementById('nameInput');
const nameSubmit = document.getElementById('nameSubmit');

function showNameModal() {
  nameInput.value = playerName || '';
  nameModal.hidden = false;
  setTimeout(() => nameInput.focus(), 0);
}
function submitName() {
  const val = nameInput.value.trim().slice(0, 14);
  playerName = val || 'Bunny Fan';
  nameModal.hidden = true;
  startGame();
}
nameSubmit.addEventListener('click', submitName);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });
</script>
</body>
